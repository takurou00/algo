name: CD - Development

on:
  push:
    branches: [develop]

concurrency:
  group: cd-dev
  cancel-in-progress: false

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ env.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/mediavault-frontend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/mediavault-frontend:dev-latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/mediavault-frontend:dev-latest
          cache-to: type=inline
          target: production

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/mediavault-backend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/mediavault-backend:dev-latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/mediavault-backend:dev-latest
          cache-to: type=inline
          target: production

  deploy-infra:
    name: Deploy Infrastructure (dev)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: terraform init
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="auth_secret=${{ secrets.AUTH_SECRET }}" \
            -var="image_tag=${{ needs.build-and-push.outputs.image_tag }}"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  run-migrations:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    needs: [deploy-infra]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run migrations
        working-directory: backend
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [run-migrations]
    if: always()
    steps:
      - name: Deployment Status
        run: |
          if [ "${{ needs.run-migrations.result }}" == "success" ]; then
            echo "✅ Dev deployment successful! SHA: ${{ github.sha }}"
          else
            echo "❌ Dev deployment failed"
            exit 1
          fi
